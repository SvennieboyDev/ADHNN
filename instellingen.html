<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instellingen — App der historische Nederlandse naamvallen</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <main class="instellingen-screen">
    <div class="oefen-header">
      <a class="back-link" href="index.html">&larr; Terug naar het startscherm</a>
    </div>

    <h1>Instellingen</h1>

    <form id="instellingen-form" class="instellingen-form">
      <fieldset>
        <legend>Hoe wil je oefenen?</legend>

        <label class="instelling-optie">
          <input type="radio" name="modus" value="deel">
          <span>
            <strong>Alleen de naamvalsvorm invullen</strong>
            <br>
            Je vult enkel het ontbrekende stukje van de zin in.
          </span>
        </label>

        <label class="instelling-optie">
          <input type="radio" name="modus" value="zin">
          <span>
            <strong>De hele zin overtypen</strong>
            <br>
            Je ziet een modern Nederlandse zin en typt die volledig over met de juiste
            historische naamvalsvormen. Kleine typefoutjes buiten de naamvalsvorm worden
            niet afgekeurd.
          </span>
        </label>
      </fieldset>

      <fieldset id="geslacht-fieldset">
        <legend>Geslacht bij het zelfstandig naamwoord</legend>

        <label class="instelling-optie">
          <input type="radio" name="geslacht" value="aan">
          <span>
            <strong>Toon geslacht</strong> (m/v/o)
            <br>
            Handig om patronen te leren herkennen.
          </span>
        </label>

        <label class="instelling-optie">
          <input type="radio" name="geslacht" value="uit">
          <span>
            <strong>Verberg geslacht</strong>
            <br>
            Voor als je je geheugen wilt trainen.
          </span>
        </label>
      </fieldset>

      <fieldset id="archaisch-fieldset" hidden>
        <legend>Archaïsche/dialectische vormen</legend>

        <label class="instelling-optie">
          <input type="checkbox" name="archaisch-du">
          <span>
            <strong>Du</strong> in plaats van gij (voor jij/u)
          </span>
        </label>

        <label class="instelling-optie">
          <input type="checkbox" name="archaisch-gijlieden">
          <span>
            <strong>Gijlieden</strong> in plaats van gij (voor jullie)
          </span>
        </label>

        <label class="instelling-optie">
          <input type="checkbox" name="archaisch-wijlieden">
          <span>
            <strong>Wijlieden</strong> in plaats van wij
          </span>
        </label>
      </fieldset>

      <fieldset id="klinker-fieldset" hidden>
        <legend>Klinkerspelling bij bijvoeglijke naamwoorden</legend>

        <label class="instelling-optie">
          <input type="radio" name="klinker" value="enkel">
          <span>
            <strong>Enkele klinker</strong> (hele, grote, hoge)
            <br>
            De hedendaagse spelling.
          </span>
        </label>

        <label class="instelling-optie">
          <input type="radio" name="klinker" value="dubbel">
          <span>
            <strong>Dubbele klinker</strong> (heele, groote, hooge)
            <br>
            De spelling zoals die gangbaar was in de tijd van de naamvallen.
          </span>
        </label>
      </fieldset>

      <fieldset>
        <legend>Hoe lang wil je oefenen?</legend>

        <div class="tijd-instelling">
          <input type="range" id="tijd-slider" min="0" max="30" step="1" value="15">
          <div class="tijd-waarde"><span id="tijd-waarde-getal">15</span> minuten</div>
          <div id="tijd-waarschuwing" class="tijd-waarschuwing" hidden>Kies minstens 1 minuut om te kunnen beginnen.</div>
        </div>
      </fieldset>

      <button type="submit" class="begin-button" id="begin-knop">Beginnen →</button>
    </form>
  </main>

  <script src="js/oefening-data.js?v=6"></script>
  <script src="js/instellingen.js?v=6"></script>
</body>
</html>
